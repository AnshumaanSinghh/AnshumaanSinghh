<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Terminal: whoami, Anshumaan Singh, software engineer and founder-minded builder. Building Tumblrr AI, BillBrake and PasteProof. Website: tumblrr.tech.">
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 22px; }
    .p { fill: #3fb950; } .c { fill: #e6edf3; } .m { fill: #8b949e; } .a { fill: #4fd1a5; font-weight: 700; } .b { fill: #79c0ff; }
    .name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 40px; font-weight: 700; fill: #e6edf3; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect width="1200" height="320" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#30363d"/>
  <circle cx="28" cy="26" r="7" fill="#ff5f57"/><circle cx="52" cy="26" r="7" fill="#febc2e"/><circle cx="76" cy="26" r="7" fill="#28c840"/>
  <text x="600" y="31" text-anchor="middle" class="t m" font-size="16">anshumaan@github: ~</text>

  <text x="40" y="88" class="t"><tspan class="p">$</tspan><tspan class="c"> whoami</tspan></text>
  <text x="40" y="138" class="name">Anshumaan Singh</text>
  <text x="40" y="174" class="t"><tspan class="m">software engineer · founder-minded builder · India</tspan></text>
  <text x="40" y="224" class="t"><tspan class="p">$</tspan><tspan class="c"> cat now-building.txt</tspan></text>
  <text x="40" y="256" class="t"><tspan class="a">Tumblrr AI</tspan><tspan class="m">  ·  </tspan><tspan class="b">BillBrake</tspan><tspan class="m">  ·  </tspan><tspan class="b">PasteProof</tspan><tspan class="m">  ·  tumblrr.tech</tspan></text>
  <text x="40" y="296" class="t"><tspan class="p">$</tspan><tspan class="c cursor"> █</tspan></text>
</svg>
